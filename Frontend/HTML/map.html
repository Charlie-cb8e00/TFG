<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa - Geobus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"> <!-- Leaflet CSS  -->
  <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>
  <div class="app d-flex flex-column vh-100">
    <header class="topbar d-flex align-items-center justify-content-between px-3 py-2">
      <span class="topbar__brand fw-bold">Geobus</span>
      <span class="topbar__icon" aria-hidden="true">🗺️</span>
    </header>

    <h1 class="titlebar text-center fw-bold m-0">Mapa</h1>

    <main class="content flex-grow-1 d-flex flex-column p-2" aria-label="Mapa de Sevilla">
      <div id="map" class="map-frame w-100 rounded" aria-label="Mapa de Sevilla"></div>
      <a class="btn btn-outline-primary btn-sm mt-2 align-self-start" href="https://www.openstreetmap.org/?mlat=37.3891&amp;mlon=-5.9845#map=14/37.3891/-5.9845" target="_blank" rel="noopener noreferrer">
        Abrir mapa completo
      </a>
    </main>

    <nav class="tabbar d-flex justify-content-around align-items-center" aria-label="Navegación principal">
      <a href="map.html" class="tab tab--active text-decoration-none text-center" aria-current="page">
        <div class="fs-5" aria-hidden="true">🗺️</div><small>Mapa</small>
      </a>
      <a href="stops.html" class="tab text-decoration-none text-center">
        <div class="fs-5" aria-hidden="true">🚏</div><small>Paradas</small>
      </a>
      <a href="index.html" class="tab text-decoration-none text-center">
        <div class="fs-5" aria-hidden="true">🏠</div><small>Inicio</small>
      </a>
      <a href="wallet.html" class="tab text-decoration-none text-center">
        <div class="fs-5" aria-hidden="true">👛</div><small>Monedero</small>
      </a>
      <a href="alarms.html" class="tab text-decoration-none text-center">
        <div class="fs-5" aria-hidden="true">🔔</div><small>Alarma</small>
      </a>
    </nav>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../JavaScript/bus-stops.js"></script>
  <script>
    const map = L.map('map');

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const recorridoIda = paradasLinea242
      .filter(parada => parada.sentido === 1)
      .sort((a, b) => a.orden - b.orden);
    const recorridoVuelta = paradasLinea242
      .filter(parada => parada.sentido === 2)
      .sort((a, b) => a.orden - b.orden);

    const paradasAgrupadas = new Map();
    paradasLinea242.forEach(function (parada) {
      const paradasMismoId = paradasAgrupadas.get(parada.id) || [];
      paradasMismoId.push(parada);
      paradasAgrupadas.set(parada.id, paradasMismoId);
    });

    const markers = Array.from(paradasAgrupadas.values(), function (paradas) {
      const parada = paradas[0];
      const sentidos = new Set(paradas.map(item => item.sentido));
      const color = sentidos.size > 1 ? '#332766' : sentidos.has(1) ? '#1e3a8a' : '#f59e0b';
      const popup = document.createElement('div');
      const nombre = document.createElement('strong');
      nombre.textContent = parada.nombre;
      popup.append(nombre);

      paradas.forEach(function (item) {
        const detalle = document.createElement('div');
        detalle.textContent = `Sentido ${item.sentido} · parada ${item.orden}`;
        popup.append(detalle);
      });

      return L.circleMarker([parada.lat, parada.lng], {
        radius: 5,
        color: '#fff',
        weight: 1.5,
        fillColor: color,
        fillOpacity: 1
      }).bindPopup(popup);
    });
    const markerGroup = L.featureGroup(markers).addTo(map);

    const routeGroup = L.featureGroup([
      L.polyline(recorridoIda.map(parada => [parada.lat, parada.lng]), {
        color: '#1e3a8a',
        weight: 5,
        opacity: 0.9
      })
        .bindPopup('Ida: Dos Hermanas → Sevilla · línea 242')
        .bindTooltip('Ida: Dos Hermanas → Sevilla'),
      L.polyline(recorridoVuelta.map(parada => [parada.lat, parada.lng]), {
        color: '#f59e0b',
        weight: 5,
        opacity: 0.9,
        dashArray: '8 8'
      })
        .bindPopup('Vuelta: Sevilla → Dos Hermanas · línea 242')
        .bindTooltip('Vuelta: Sevilla → Dos Hermanas')
    ]).addTo(map);

    map.fitBounds(L.featureGroup([markerGroup, routeGroup]).getBounds().pad(0.1));
  </script>
</body>
</html>
