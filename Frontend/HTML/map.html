<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa - Geobus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"> <!-- Leaflet CSS  -->
  <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>
  <div class="app d-flex flex-column vh-100">
    <header class="topbar d-flex align-items-center justify-content-between px-3 py-2">
      <span class="topbar__brand fw-bold">Geobus</span>
      <span class="topbar__icon" aria-hidden="true">🗺️</span>
    </header>

    <h1 class="titlebar text-center fw-bold m-0">Mapa</h1>

    <main class="content flex-grow-1 d-flex flex-column p-2" aria-label="Mapa de Sevilla">
      <div id="map" class="map-frame w-100 rounded" aria-label="Mapa de Sevilla"></div>
      <a class="btn btn-outline-primary btn-sm mt-2 align-self-start" href="https://www.openstreetmap.org/?mlat=37.3891&amp;mlon=-5.9845#map=14/37.3891/-5.9845" target="_blank" rel="noopener noreferrer">
        Abrir mapa completo
      </a>
    </main>

    <nav class="tabbar d-flex justify-content-around align-items-center" aria-label="Navegación principal">
      <a href="map.html" class="tab tab--active text-decoration-none text-center" aria-current="page">
        <div class="fs-5" aria-hidden="true">🗺️</div><small>Mapa</small>
      </a>
      <a href="stops.html" class="tab text-decoration-none text-center">
        <div class="fs-5" aria-hidden="true">🚏</div><small>Paradas</small>
      </a>
      <a href="index.html" class="tab text-decoration-none text-center">
        <div class="fs-5" aria-hidden="true">🏠</div><small>Inicio</small>
      </a>
      <a href="wallet.html" class="tab text-decoration-none text-center">
        <div class="fs-5" aria-hidden="true">👛</div><small>Monedero</small>
      </a>
      <a href="alarms.html" class="tab text-decoration-none text-center">
        <div class="fs-5" aria-hidden="true">🔔</div><small>Alarma</small>
      </a>
    </nav>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const center = L.latLng(37.3891, -5.9845);
  const map = L.map('map');

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  const radiusMeters = 5000;
  const markerCount = 43;
  const markers = [];

  for (let i = 0; i < markerCount; i++) {
    const angle = (2 * Math.PI * i) / markerCount;
    const lat = center.lat + (radiusMeters * Math.cos(angle)) / 111320;
    const lng = center.lng
      + (radiusMeters * Math.sin(angle))
      / (111320 * Math.cos((center.lat * Math.PI) / 180));

    markers.push(L.marker([lat, lng]).bindPopup(`Parada ${i + 1}`));
  }

  const markerGroup = L.featureGroup(markers).addTo(map);
  map.fitBounds(markerGroup.getBounds().pad(0.1));
</script>
</body>
</html>
