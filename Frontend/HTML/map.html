<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa - Geobus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>
  <div class="app d-flex flex-column vh-100">
    <header class="topbar d-flex align-items-center justify-content-between px-3 py-2">
      <span class="topbar__brand fw-bold">Geobus</span>
      <span class="topbar__icon" aria-hidden="true">🗺️</span>
    </header>

    <h1 class="titlebar text-center fw-bold m-0">Mapa</h1>

    <main class="content flex-grow-1 d-flex flex-column p-2" aria-label="Mapa de Sevilla">
      <iframe
        class="map-frame w-100 rounded"
        title="Mapa de Sevilla y sus paradas"
        src="https://www.openstreetmap.org/export/embed.html?bbox=-6.02%2C37.37%2C-5.95%2C37.41&amp;layer=mapnik&amp;marker=37.3891%2C-5.9845"
        loading="lazy"
        referrerpolicy="no-referrer">
      </iframe>
      <a class="btn btn-outline-primary btn-sm mt-2 align-self-start" href="https://www.openstreetmap.org/?mlat=37.3891&amp;mlon=-5.9845#map=14/37.3891/-5.9845" target="_blank" rel="noopener noreferrer">
        Abrir mapa completo
      </a>
    </main>

    <nav class="tabbar d-flex justify-content-around align-items-center" aria-label="Navegación principal">
      <a href="map.html" class="tab tab--active text-decoration-none text-center" aria-current="page">
        <div class="fs-5" aria-hidden="true">🗺️</div><small>Mapa</small>
      </a>
      <a href="stops.html" class="tab text-decoration-none text-center">
        <div class="fs-5" aria-hidden="true">🚏</div><small>Paradas</small>
      </a>
      <a href="index.html" class="tab text-decoration-none text-center">
        <div class="fs-5" aria-hidden="true">🏠</div><small>Inicio</small>
      </a>
      <a href="wallet.html" class="tab text-decoration-none text-center">
        <div class="fs-5" aria-hidden="true">👛</div><small>Monedero</small>
      </a>
      <a href="alarms.html" class="tab text-decoration-none text-center">
        <div class="fs-5" aria-hidden="true">🔔</div><small>Alarma</small>
      </a>
    </nav>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
