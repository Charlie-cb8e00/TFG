<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alarmas - Geobus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>
  <div class="app d-flex flex-column vh-100">
    <header class="topbar d-flex align-items-center justify-content-between px-3 py-2">
      <span class="topbar__brand fw-bold">Geobus</span>
      <span class="topbar__icon" aria-hidden="true">🔔</span>
    </header>

    <h1 class="titlebar text-center fw-bold m-0">Alarmas</h1>

    <main class="content flex-grow-1 overflow-auto p-3" aria-label="Alarmas configuradas">
      <div class="alarm">
        <span class="alarm__time">4:50</span>
        <span class="alarm__info">
          <strong class="alarm__name">Alarma 1</strong>
          <strong class="alarm__stop">Parada 1</strong>
          <span class="alarm__actions">
            <button type="button" class="btn-alarm btn-edit">Editar</button>
            <button type="button" class="btn-alarm btn-delete">Eliminar</button>
          </span>
        </span>
      </div>
    </main>

    <button type="button" class="btn-add-floating" id="btnNuevaAlarma" aria-label="Añadir alarma">+</button>

    <nav class="tabbar d-flex justify-content-around align-items-center" aria-label="Navegación principal">
      <a href="map.html" class="tab text-decoration-none text-center">
        <div class="fs-5" aria-hidden="true">🗺️</div><small>Mapa</small>
      </a>
      <a href="stops.html" class="tab text-decoration-none text-center">
        <div class="fs-5" aria-hidden="true">🚏</div><small>Paradas</small>
      </a>
      <a href="index.html" class="tab text-decoration-none text-center">
        <div class="fs-5" aria-hidden="true">🏠</div><small>Inicio</small>
      </a>
      <a href="wallet.html" class="tab text-decoration-none text-center">
        <div class="fs-5" aria-hidden="true">👛</div><small>Monedero</small>
      </a>
      <a href="alarms.html" class="tab tab--active text-decoration-none text-center" aria-current="page">
        <div class="fs-5" aria-hidden="true">🔔</div><small>Alarma</small>
      </a>
    </nav>
  </div>

  <div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="modalEditarLabel">Editar alarma</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <form id="formAlarma">
          <div class="modal-body">
            <div class="mb-3">
              <label for="inputTiempoAlarma" class="form-label">Tiempo</label>
              <input type="text" class="form-control" id="inputTiempoAlarma" placeholder="Ej: 04:50" required>
            </div>
            <div class="mb-3">
              <label for="inputNombreAlarma" class="form-label">Nombre de la alarma</label>
              <input type="text" class="form-control" id="inputNombreAlarma" placeholder="Escribe el nombre" required>
            </div>
            <div class="mb-3">
              <label for="inputParadaAlarma" class="form-label">Parada a seguir</label>
              <input type="text" class="form-control" id="inputParadaAlarma" placeholder="Escribe la parada" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="btnConfirmarEditar">Confirmar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalEliminar" tabindex="-1" aria-labelledby="modalEliminarLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="modalEliminarLabel">Eliminar alarma</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p class="mb-0">¿Estás seguro de que quieres eliminar esta alarma?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="btnConfirmarEliminar">Eliminar</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JavaScript/script.js"></script>
</body>
</html>
