<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alarmas - Geobus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>
  <div class="app d-flex flex-column vh-100">

    <!-- HEADER -->
    <header class="topbar d-flex align-items-center justify-content-between px-3 py-2">
      <span class="fw-bold text-white">Geobus</span>
      <span class="fs-5">🏠</span>
    </header>

    <!-- Título -->
    <div class="titlebar text-center text-white fw-bold py-3">
      Alarmas
    </div>

    <!-- CONTENIDO -->
    <main class="content flex-grow-1 overflow-auto p-3">
      
      <!-- Alarma 1 -->
      <div class="alarm">
        <span class="alarm__time">4:50</span>
        <span class="alarm__info">
          <strong class="alarm__name">Alarma 1</strong>
          <div class="alarm__actions">
            <button class="btn-alarm btn-edit">Editar</button>
            <button class="btn-alarm btn-delete">Eliminar</button>
          </div>
        </span>
      </div>
      <div class="alarm">
        <span class="alarm__time">4:50</span>
        <span class="alarm__info">
          <strong class="alarm__name">Alarma 2</strong>
          <div class="alarm__actions">
            <button class="btn-alarm btn-edit">Editar</button>
            <button class="btn-alarm btn-delete">Eliminar</button>
          </div>
        </span>
      </div>
      <div class="alarm">
        <span class="alarm__time">4:50</span>
        <span class="alarm__info">
          <strong class="alarm__name">Alarma 3</strong>
          <div class="alarm__actions">
            <button class="btn-alarm btn-edit">Editar</button>
            <button class="btn-alarm btn-delete">Eliminar</button>
          </div>
        </span>
      </div>
      <div class="alarm">
        <span class="alarm__time">4:50</span>
        <span class="alarm__info">
          <strong class="alarm__name">Alarma 4</strong>
          <div class="alarm__actions">
            <button class="btn-alarm btn-edit">Editar</button>
            <button class="btn-alarm btn-delete">Eliminar</button>
          </div>
        </span>
      </div>
      <div class="alarm">
        <span class="alarm__time">4:50</span>
        <span class="alarm__info">
          <strong class="alarm__name">Alarma 5</strong>
          <div class="alarm__actions">
            <button class="btn-alarm btn-edit">Editar</button>
            <button class="btn-alarm btn-delete">Eliminar</button>
          </div>
        </span>
      </div>
      <div class="alarm">
        <span class="alarm__time">4:50</span>
        <span class="alarm__info">
          <strong class="alarm__name">Alarma 6</strong>
          <div class="alarm__actions">
            <button class="btn-alarm btn-edit">Editar</button>
            <button class="btn-alarm btn-delete">Eliminar</button>
          </div>
        </span>
      </div>
      <div class="alarm">
        <span class="alarm__time">4:50</span>
        <span class="alarm__info">
          <strong class="alarm__name">Alarma 7</strong>
          <div class="alarm__actions">
            <button class="btn-alarm btn-edit">Editar</button>
            <button class="btn-alarm btn-delete">Eliminar</button>
          </div>
        </span>
      </div>

    </main>

    <!-- TABBAR -->
    <nav class="tabbar d-flex justify-content-around align-items-center">
      <a href="#mapa" class="tab text-decoration-none text-center" onclick="irA(event, 'map.html')">
        <div class="fs-5">🗺️</div>
        <small>Mapa</small>
      </a>
      <a href="#paradas" class="tab text-decoration-none text-center" onclick="irA(event, 'stops.html')">
        <div class="fs-5">🚏</div>
        <small>Paradas</small>
      </a>
      <a href="#inicio" class="tab text-decoration-none text-center" onclick="irA(event, 'index.html')">
        <div class="fs-5">🏠</div>
        <small>Inicio</small>
      </a>
      <a href="#monedero" class="tab text-decoration-none text-center" onclick="irA(event, 'wallet.html')">
        <div class="fs-5">👛</div>
        <small>Monedero</small>
      </a>
      <a href="#alarma" class="tab tab--active text-decoration-none text-center" onclick="irA(event, 'alarms.html')">
        <div class="fs-5">🔔</div>
        <small>Alarma</small>
      </a>
    </nav>

  </div>
<!-- ===================== MODALES ===================== -->

  <!-- Modal Editar -->
  <div class="modal fade" id="modalEditar" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Editar alarma</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="inputTiempoAlarma" class="form-label">Tiempo</label>
            <input type="text" class="form-control" id="inputTiempoAlarma" placeholder="Ej: 4:50">
          </div>
          <div class="mb-3">
            <label for="inputNombreAlarma" class="form-label">Nombre de la alarma</label>
            <input type="text" class="form-control" id="inputNombreAlarma" placeholder="Escribe el nombre">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btnConfirmarEditar">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Eliminar -->
  <div class="modal fade" id="modalEliminar" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Eliminar alarma</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="mb-0">¿Estás seguro de que quieres eliminar esta alarma?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="btnConfirmarEliminar">Eliminar</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JavaScript/script.js"></script>
</body>
</html>
