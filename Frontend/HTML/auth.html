<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Geobus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>
  <div class="app d-flex flex-column vh-100">
    <header class="topbar d-flex align-items-center justify-content-between px-3 py-2">
      <span class="topbar__brand fw-bold">Geobus</span>
      <a class="topbar__auth text-decoration-none" href="index.html">Volver</a>
    </header>

    <h1 class="titlebar text-center fw-bold m-0">Acceso a GeoBus</h1>

    <main class="content flex-grow-1 overflow-auto p-3" aria-label="Acceso a la cuenta">
      <section class="auth-panel" aria-label="Iniciar sesión o registrarse">
        <p class="auth-notice" id="authNotice" role="status">
          La autenticación todavía no está conectada al servidor. Estos formularios son solo una interfaz de demostración.
        </p>

        <div class="auth-tabs" aria-label="Tipo de acceso">
          <button type="button" class="auth-tab" id="tabIniciarSesion" aria-pressed="true">
            Iniciar sesión
          </button>
          <button type="button" class="auth-tab" id="tabRegistro" aria-pressed="false">
            Registrarse
          </button>
        </div>

        <form id="formIniciarSesion" class="auth-form">
          <h2 class="h5 mb-3">Iniciar sesión</h2>
          <div class="mb-3">
            <label for="correoInicio" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="correoInicio" name="correo"
                   autocomplete="email" required>
          </div>
          <div class="mb-3">
            <label for="contrasenaInicio" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="contrasenaInicio" name="contrasena"
                   autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
        </form>

        <form id="formRegistro" class="auth-form" hidden>
          <h2 class="h5 mb-3">Crear cuenta</h2>
          <div class="mb-3">
            <label for="nombreRegistro" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombreRegistro" name="nombre"
                   autocomplete="name" required>
          </div>
          <div class="mb-3">
            <label for="correoRegistro" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="correoRegistro" name="correo"
                   autocomplete="email" required>
          </div>
          <div class="mb-3">
            <label for="contrasenaRegistro" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="contrasenaRegistro" name="contrasena"
                   autocomplete="new-password" minlength="8" required>
          </div>
          <div class="mb-3">
            <label for="confirmarContrasena" class="form-label">Repetir contraseña</label>
            <input type="password" class="form-control" id="confirmarContrasena"
                   autocomplete="new-password" minlength="8" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
        </form>
      </section>
    </main>

    <nav class="tabbar d-flex justify-content-around align-items-center" aria-label="Navegación principal">
      <a href="map.html" class="tab text-decoration-none text-center">
        <div class="fs-5" aria-hidden="true">🗺️</div><small>Mapa</small>
      </a>
      <a href="stops.html" class="tab text-decoration-none text-center">
        <div class="fs-5" aria-hidden="true">🚏</div><small>Paradas</small>
      </a>
      <a href="index.html" class="tab text-decoration-none text-center">
        <div class="fs-5" aria-hidden="true">🏠</div><small>Inicio</small>
      </a>
      <a href="wallet.html" class="tab text-decoration-none text-center">
        <div class="fs-5" aria-hidden="true">👛</div><small>Monedero</small>
      </a>
      <a href="alarms.html" class="tab text-decoration-none text-center">
        <div class="fs-5" aria-hidden="true">🔔</div><small>Alarma</small>
      </a>
    </nav>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JavaScript/script.js"></script>
</body>
</html>
