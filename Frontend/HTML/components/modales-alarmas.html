<!-- ========== MODAL EDITAR ========== -->
<div class="modal fade" id="modalEditar" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Editar alarma</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        
        <div class="mb-3">
          <label for="inputTiempoAlarma" class="form-label">Tiempo</label>
          <input type="text" class="form-control" id="inputTiempoAlarma" placeholder="Ej: 4:50">
        </div>

        <div class="mb-3">
          <label for="inputNombreAlarma" class="form-label">Nombre de la alarma</label>
          <input type="text" class="form-control" id="inputNombreAlarma" placeholder="Escribe el nombre">
        </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnConfirmarEditar">Confirmar</button>
      </div>
    </div>
  </div>
</div>

      </div>
      <div class="modal-body">
        <p class="mb-0">¿Estás seguro de que quieres eliminar esta alarma?</p>

      <div class="modal-footer">
