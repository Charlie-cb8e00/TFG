spring.application.name=geobus

# Conexión a PostgreSQL. La contraseña NO se escribe aquí: se lee de la variable de entorno DB_PASSWORD
spring.datasource.url=jdbc:postgresql://192.168.96.222:5432/GeoBus?reWriteBatchedInserts=true
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# La estructura ya la crea schema.sql a mano: Hibernate no debe tocar las tablas
spring.jpa.hibernate.ddl-auto=none

# Feed GTFS unificado de la Red de Consorcios de Transporte de Andalucía
gtfs.url=https://api.ctan.es/v1/datos/UNIFICADO/gtfs.zip

# El importador actual apunta a un esquema distinto del modelo del entregable
gtfs.import.enabled=false
